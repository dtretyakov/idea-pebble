blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/dtretyakov/idea-pebble/security/advisories/new
    about: Report privately rather than as an issue. See SECURITY.md.
  - name: pebble-tool itself
    url: https://github.com/coredevices/pebble-tool/issues
    about: >
      A pebble-tool error, an SDK install that fails or an emulator crash belongs with pebble-tool,
      not this plugin — unless the plugin is what mangled it.
  - name: Pebble development questions
    url: https://developer.repebble.com/community
    about: How to do something on the watch, rather than in the IDE.
