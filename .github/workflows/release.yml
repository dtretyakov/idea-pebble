# Publishing a release to JetBrains Marketplace.
#
# Triggered by a tag, so the thing that was tested is the thing that ships: the tag has to name the
# version in gradle.properties, and the job refuses to publish if it does not. Everything the
# ordinary build checks runs again here, because a release is the one build nobody re-runs.
name: Release

on:
  push:
    tags: ["v*"]
  # Publishing by hand, for the first upload — which the Marketplace requires to go through the
  # web form anyway, and which this workflow therefore cannot do.
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Build and sign, but do not upload"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # First and on its own, so that a tag naming the wrong version stops the release before anything
  # spends ten minutes downloading IDEs for it.
  version:
    name: The tag and the version agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag and the version have to agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep -E '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged, gradle.properties says $declared." >&2
            exit 1
          fi

  # Every IDE the plugin claims, as the build workflow checks them. The Marketplace runs the
  # verifier itself and holds the upload until it passes, so failing here costs minutes instead of a
  # review cycle. A runner each: two whole IDEs do not fit on one runner's disk, which is how a
  # release that verified both ends of the range in one job would have failed, at the end.
  verify:
    name: Verify against ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: the newest supported IDE
            flag: ""
          - name: the oldest supported IDE
            flag: -PverifySince
          - name: CLion
            flag: -PverifyClion
          - name: WebStorm
            flag: -PverifyWebStorm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # No Gradle cache in a release: what the build workflow's jobs saved holds whole IDEs, which
      # filled a runner's disk on restore, and the one build nobody re-runs is better built from
      # nothing anyway.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Free the disk the IDE needs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Verify plugin
        run: ./gradlew verifyPlugin ${{ matrix.flag }}

  release:
    name: Build, sign and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # No Gradle cache in a release: what the build workflow's jobs saved holds whole IDEs, which
      # filled a runner's disk on restore, and the one build nobody re-runs is better built from
      # nothing anyway.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build and test
        run: ./gradlew build

      - name: Self-check
        run: ./gradlew runSelfCheck

      - name: Sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin verifyPluginSignature

      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip

      - name: Publish to JetBrains Marketplace
        if: startsWith(github.ref, 'refs/tags/') && inputs.dryRun != true
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      # The signed zip, where someone who does not want it from the Marketplace can find it: an
      # install-from-disk is the whole of the beta story for anyone who will not add a channel.
      # The signed one and not the plain one, because it is the artifact that installs without a
      # dialog asking whether to trust it.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md) \
            $prerelease \
            build/distributions/*-signed.zip
